# Деплой production на Vercel при push в main.
# GitHub сам сайт не хостит для Next.js+API — нужен хостинг (Vercel и т.п.).
#
# Настройка (один раз):
# 1. https://vercel.com → New Project → Import репозитория under2ker/Sensify.
# 2. В Vercel: Settings → Environment Variables — задать AUTH_SECRET, DATABASE_URL, NEXTAUTH_URL, GROQ_API_KEY и др. (см. README).
# 3. Vercel → Settings → General → скопировать Project ID и Team (Org) ID.
# 4. https://vercel.com/account/tokens → создать token.
# 5. GitHub репозиторий → Settings → Secrets and variables → Actions → добавить:
#    VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#
# Альтернатива без этого workflow: только шаг 1–2 — Vercel сам собирает при каждом push.

name: Deploy (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
